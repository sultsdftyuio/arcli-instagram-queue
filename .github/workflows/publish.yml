name: Publish due posts

on:
  schedule:
    # off the quarter hours, where GitHub's scheduler is busiest and drops runs
    - cron: "7,22,37,52 * * * *"
  # a change to the queue is published straight away if it is already due
  push:
    branches: [main]
    paths: [queue.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would be published
        type: boolean
        default: false

# One run at a time, so two runs can never publish the same post.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Publish
        run: node scripts/publish.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      # the same Reel on Threads, YouTube Shorts, TikTok (drafts) and LinkedIn, once it is live on Instagram
      - name: Cross-post
        if: always()
        run: node scripts/crosspost.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR: ${{ secrets.LINKEDIN_AUTHOR }}
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Save queue state
        if: always()
        run: |
          git config user.name "arcli-queue"
          git config user.email "arcli-queue@users.noreply.github.com"
          git add -A queue.json
          # media/ is absent whenever nothing is queued; a bare "git add media" then fails the run
          if [ -d media ] || git ls-files --error-unmatch media >/dev/null 2>&1; then git add -A media; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update queue"
            git pull --rebase
            git push
          fi
