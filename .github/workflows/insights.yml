name: Post insights

on:
  schedule:
    # 06:00 Gulf time, before the day's first post.
    - cron: "0 2 * * *"
  workflow_dispatch:

# Shares the publish group so the two workflows never push at the same moment.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch insights
        run: node scripts/insights.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      - name: Save insights
        run: |
          git config user.name "arcli-queue"
          git config user.email "arcli-queue@users.noreply.github.com"
          git add insights
          if ! git diff --cached --quiet; then
            git commit -m "Update insights"
            git pull --rebase
            git push
          fi
