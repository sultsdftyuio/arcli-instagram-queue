<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign-in code</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #0a1628; background: #f4f8ff; }
  code { display: block; padding: 12px; background: #fff; border: 1px solid #dde8f2; border-radius: 8px; word-break: break-all; }
  button { margin-top: 12px; padding: 8px 16px; border: 0; border-radius: 8px; background: #1b6ebf; color: #fff; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<h1>Sign-in code</h1>
<p id="msg">Copy this code back into the terminal. It is shown only here, in your browser, and stored nowhere.</p>
<code id="code"></code>
<button id="copy">Copy</button>
<script>
  // Only reads the query string of this page; nothing is sent anywhere.
  var q = new URLSearchParams(location.search);
  var code = q.get("code");
  var el = document.getElementById("code");
  if (code) el.textContent = code;
  else {
    el.textContent = q.get("error_description") || q.get("error") || "No code in this link.";
    document.getElementById("msg").textContent = "The sign-in did not return a code:";
  }
  document.getElementById("copy").onclick = function () { navigator.clipboard.writeText(el.textContent); };
</script>
</body>
</html>
